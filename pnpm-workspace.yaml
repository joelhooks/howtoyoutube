allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true

# Keep one Effect runtime across Alchemy, Foldkit, and the platform packages.
overrides:
  "@effect/platform-browser": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@effect/platform-bun": 4.0.6
  "@effect/platform-node": 4.0.6
  effect: 4.0.6
  alchemy: 2.0.0-beta.84

# Copied from rat-stack main (2cdcd50). See README.md for removal criteria.
peerDependencyRules:
  allowedVersions:
    "foldkit>effect": 4.0.6
    "foldkit>@effect/platform-browser": 4.0.6
    "@foldkit/devtools>effect": 4.0.6
    "@foldkit/devtools>@effect/platform-browser": 4.0.6
    "@foldkit/vite-plugin>effect": 4.0.6

patchedDependencies:
  "@foldkit/vite-plugin@0.28.0": patches/@foldkit__vite-plugin@0.28.0.patch
